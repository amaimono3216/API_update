services:
  app:
    build:
      context: .
      target: dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://api_update:api_update@db:5432/api_update
      REDIS_URL: redis://redis:6379
      # 対象リポジトリのコマンドは使い捨てコンテナで実行する。
      # 作業コピーは兄弟コンテナと共有するボリューム上に置く必要がある。
      WORKSPACE_ROOT: /workspaces
      SANDBOX_WORKSPACE_VOLUME: api_update_workspaces
    # Docker ソケットは root:root 660 のため、非 root で動くアプリからは
    # グループ経由でしか触れない。ソケットを渡す時点でホストに対する強い権限を
    # 与えているので、この追加で脅威モデルは実質変わらない。
    group_add:
      - "0"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # ソースはバインドマウントでホットリロード。node_modules はイメージ側を維持する
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - app_node_modules:/app/node_modules
      # 作業コピー。サンドボックスコンテナへ同じボリュームをマウントする
      - workspaces:/workspaces
      # 兄弟コンテナを起動するために Docker ソケットを渡す。
      # これはホストに対する強い権限なので、アプリ側のコードを信頼できることが前提。
      # 見返りに、信頼できない対象リポジトリのコードがこのコンテナで動かなくなる。
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: api_update
      POSTGRES_PASSWORD: api_update
      POSTGRES_DB: api_update
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # スキーマはアプリ起動時の migrations/ 適用に一本化している
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_update -d api_update"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  app_node_modules:
  db_data:
  redis_data:
  # サンドボックスコンテナへ `--volume api_update_workspaces:/workspaces` で渡すため、
  # 名前を固定する（compose の自動プレフィックスに依存しない）
  workspaces:
    name: api_update_workspaces
